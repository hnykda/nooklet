# DRAFT — not applied. Defaults; the deployment's real values are in values/nooklet.yaml.gotmpl.
image:
  repository: registry.container-registry:5000/nooklet
  tag: ""            # required — CI sets sha-<commit>; never `latest`
  pullPolicy: IfNotPresent

# Every Host name clients use to reach the server. nooklet answers 403 to any other (its
# DNS-rebinding guard), and its 403 message names the rejected host — add that one here if the
# Tailscale proxy turns out to forward a different Host than the MagicDNS name.
allowHosts:
  - nooklet.<tailnet>.ts.net

rootToken: ""        # from SOPS (k8s/environments/secrets.yaml → nooklet.rootToken)

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    cpu: "1"
    memory: 768Mi

persistence:
  storageClassName: database-storage
  size: 5Gi          # hostpath PVCs cannot be resized later (infra-repo hermes values note)

backup:
  enabled: true
  schedule: "30 1 * * *"   # before the home server's 02:00 duplicacy run
  keepDays: 7
