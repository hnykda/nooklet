{{- if not .Values.allowHosts }}
{{- fail "allowHosts is required: the Host name(s) clients use to reach this server" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nooklet.fullname" . }}
  labels:
    {{- include "nooklet.labels" . | nindent 4 }}
spec:
  replicas: 1                # SQLite, one writer process: never scale this
  revisionHistoryLimit: 3
  strategy:
    type: Recreate           # a RollingUpdate would briefly run two servers on one database
  selector:
    matchLabels:
      {{- include "nooklet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nooklet.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The server never talks to the Kubernetes API; don't hand it a credential that could.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "nooklet.podSecurityContext" . | nindent 8 }}
      initContainers:
      # The server reads <data>/root.token (minting one if absent). Copying the Secret over it on
      # every start makes the Secret the source of truth: rotating = edit the Secret + restart.
      - name: root-token
        image: {{ include "nooklet.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "-c", "cp /secret/root-token /data/root.token && chmod 600 /data/root.token"]
        securityContext:
          {{- include "nooklet.containerSecurityContext" . | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: root-token
          mountPath: /secret
          readOnly: true
      containers:
      - name: nooklet
        image: {{ include "nooklet.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - serve
        - --data
        - /data
        - --host
        - 0.0.0.0
        - --port
        - "6100"
        - --web
        - /app/web
        - --allow-host
        - {{ join "," .Values.allowHosts | quote }}
        # No auto-issued token for "this machine" (B-600, decision D3). An ingress proxy in another
        # pod connects from a pod IP, never loopback, but `kubectl port-forward` and any sidecar
        # proxy arrive over the pod's loopback and would otherwise be handed a write + sync token.
        # Nothing legitimate needs it: no browser runs inside the pod.
        - --no-loopback-token
        ports:
        - name: http
          containerPort: 6100
          protocol: TCP
        securityContext:
          {{- include "nooklet.containerSecurityContext" . | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # `/healthz` sits outside the Host guard (kubelet's Host is the pod IP); `Host: localhost`
        # is belt-and-braces in case that ever changes.
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "nooklet.fullname" . }}
      - name: root-token
        secret:
          secretName: {{ include "nooklet.secretName" . }}
          items:
          - key: root-token
            path: root-token
