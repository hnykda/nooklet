# A consistent snapshot of every graph into <volume>/backups/, for whatever copies the volume
# off-site (a file-level copy of a live SQLite database mid-write is not guaranteed consistent; this
# archive is). `nooklet backup` is a VACUUM INTO snapshot + assets and is safe while the server runs.
#
# It mounts the server's ReadWriteOnce volume. RWO is per NODE, so this works on a single-node
# cluster; on a multi-node cluster add pod affinity to the server pod, or the job stays Pending.
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nooklet.fullname" . }}-backup
  labels:
    {{- include "nooklet.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- include "nooklet.podSecurityContext" . | nindent 12 }}
          containers:
          - name: backup
            image: {{ include "nooklet.image" . }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            securityContext:
              {{- include "nooklet.containerSecurityContext" . | nindent 14 }}
            command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /data/backups
              stamp=$(date +%Y-%m-%d)
              for dir in /data/graphs/*/; do
                [ -d "$dir" ] || continue
                id=$(basename "$dir")
                /app/node /app/server.mjs backup --data /data --graph "$id" \
                  --out "/data/backups/nooklet-$id-$stamp.tar"
              done
              find /data/backups -name 'nooklet-*.tar' -mtime +{{ .Values.backup.keepDays }} -delete
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: data
              mountPath: /data
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "nooklet.fullname" . }}
{{- end }}
