# ClusterIP only. Exposure (an Ingress, a tailnet proxy, a port-forward) is the deployer's choice
# and lives outside this chart; whatever it is, the Host name clients use goes in allowHosts.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nooklet.fullname" . }}
  labels:
    {{- include "nooklet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nooklet.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
