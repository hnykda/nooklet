# nginx config for deploy/docker/site.Dockerfile (apps/site's static export in /usr/share/nginx/html).
# TLS, HSTS and http->https belong to whatever terminates TLS in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json;

    # Repeated in every location that sets its own add_header (nginx does not inherit them then).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # next.config.ts uses trailingSlash: false, so `/docs/sync` is written as `docs/sync.html`
    # (with its raw-markdown twin `docs/sync.md` beside it): try the extensionless URL as .html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The raw markdown twins (llms.txt convention: page URL + `.md`). nginx's mime.types has no
    # .md entry, so without this they would download as application/octet-stream.
    location ~* \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    # Content-hashed build output: safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
