<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nooklet</title>
    <!--
      Tauri's `frontendDist` (../src-tauri/tauri.conf.json). It lived in `apps/desktop/dist/`, which
      `.gitignore`'s `dist/` swallowed: it existed in one working copy and nowhere else, and a fresh
      checkout could not even `cargo check` the app (B-490). Hand-written, not built — keep it here.

      Every window the shell opens starts here (ADR 032): "Connecting…" until the graph it was
      opened for answers, then it goes there. It used to also be the graph picker and the "add a
      server" form; both moved into the app's own graph menu (proposal 005), so this page only
      waits, and says so when it can't reach the graph.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: Canvas; color: CanvasText;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
      p { margin: .5rem 0; opacity: .8; }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem;
      }
      pre {
        text-align: left; padding: .75rem .9rem; border-radius: .5rem;
        background: color-mix(in srgb, CanvasText 8%, transparent); overflow-x: auto;
        user-select: all;
      }
      #detail { max-height: 16rem; white-space: pre-wrap; word-break: break-word; }
      .row { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
      button {
        font: inherit; padding: .45rem .8rem; border-radius: .45rem;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: Canvas; color: CanvasText; cursor: pointer;
      }
      .spin { opacity: .6 }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">nooklet</h1>
      <p id="status" class="spin">Connecting…</p>
      <div id="problem" hidden>
        <p id="message"></p>
        <pre id="detail" hidden></pre>
        <pre id="serve" hidden>pnpm nooklet serve</pre>
      </div>
      <div id="actions" class="row" hidden>
        <button id="retry" type="button">Try again</button>
        <button id="open-mac" type="button" hidden>Open a graph on this Mac</button>
      </div>
    </main>
    <script type="module">
      import { describeStatus } from "./status.js";

      const desktop = window.__NOOKLET_DESKTOP__ ?? {};
      // What this window was opened for (`main.rs#ConnectTarget`): the graph's own address (or a
      // page in it), whether it is This Mac's or a server's, and its name.
      const target = desktop.connect ?? null;
      const port = typeof desktop.port === "number" ? desktop.port : 6100;
      const MAC = `http://127.0.0.1:${port}`;
      const url = typeof target?.url === "string" ? target.url : `${MAC}/g/default`;
      const onMac = target ? target.place === "mac" : true;

      const $ = (id) => document.getElementById(id);

      /** `@tauri-apps/api`'s `invoke` is a wrapper over the same call; this page has no bundler to
       * import it, so it reads Tauri 2's own injected internals directly. */
      function invoke(cmd, args) {
        const fn = window.__TAURI_INTERNALS__?.invoke;
        if (typeof fn !== "function") return Promise.reject(new Error("not running inside nooklet"));
        return fn(cmd, args);
      }

      /** `no-cors` because /healthz sends no CORS headers: an opaque response still proves the
       * server answered, and a network failure still throws. That is all we need to know. */
      async function reachable(address) {
        try {
          await fetch(new URL("/healthz", address), { mode: "no-cors", cache: "no-store" });
          return true;
        } catch {
          return false;
        }
      }

      /** What the app knows about its bundled server (B-430), or null with nobody to ask. */
      async function serverStatus() {
        try {
          return await invoke("server_status");
        } catch {
          return null;
        }
      }

      function host(address) {
        try {
          return new URL(address).host;
        } catch {
          return address;
        }
      }

      let shown = "";
      function render(view) {
        // Re-rendered on every poll; only touch the DOM when the words change, so text being
        // selected in the output box is not wiped every few seconds.
        const key = JSON.stringify(view);
        if (key === shown) return;
        shown = key;
        const starting = view.kind === "starting";
        $("title").textContent = starting ? "nooklet" : view.title;
        $("status").hidden = !starting;
        $("status").textContent = view.title;
        $("problem").hidden = starting;
        $("message").textContent = view.message;
        $("detail").hidden = !view.detail;
        $("detail").textContent = view.detail ?? "";
        $("serve").hidden = !view.suggestServe;
        $("actions").hidden = starting;
        // From a server's graph, This Mac is the way out; on This Mac there is nowhere else to go.
        $("open-mac").hidden = onMac;
      }

      async function attempt() {
        if (await reachable(url)) {
          location.replace(url);
          return true;
        }
        if (!onMac) {
          render({
            kind: "problem",
            title: `Couldn't reach ${host(url)}.`,
            message: target?.label
              ? `“${target.label}” is on that server. Check this Mac's network connection and that the server is running.`
              : "Check this Mac's network connection and that the server is running.",
            suggestServe: false,
          });
          return false;
        }
        render(describeStatus(await serverStatus()));
        return false;
      }

      $("retry").addEventListener("click", () => {
        shown = "";
        render({ kind: "starting", title: "Connecting…", message: "", suggestServe: false });
        void attempt();
      });
      // Any navigation to a graph's address is the shell's to route (`main.rs#on_navigation`):
      // This Mac's default graph opens in this window, with its bundled server already running.
      $("open-mac").addEventListener("click", () => location.assign(`${MAC}/g/default`));

      // Keep checking while the window is open: a server that finishes starting, or comes back,
      // opens the graph with no click. Quick while This Mac's server is starting (a normal launch
      // takes a second or two), slower once there is a problem on screen.
      async function loop() {
        if (await attempt()) return;
        const starting = shown && JSON.parse(shown).kind === "starting";
        setTimeout(loop, starting ? 300 : 3000);
      }
      void loop();
    </script>
  </body>
</html>
