<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nooklet</title>
    <!--
      Tauri's `frontendDist` (../src-tauri/tauri.conf.json). It lived in `apps/desktop/dist/`, which
      `.gitignore`'s `dist/` swallowed: it existed in one working copy and nowhere else, and a fresh
      checkout could not even `cargo check` the app (B-490). Hand-written, not built — keep it here.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: Canvas; color: CanvasText;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
      p { margin: .5rem 0; opacity: .8; }
      code, pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem;
      }
      pre {
        text-align: left; padding: .75rem .9rem; border-radius: .5rem;
        background: color-mix(in srgb, CanvasText 8%, transparent); overflow-x: auto;
        user-select: all;
      }
      #detail { max-height: 16rem; white-space: pre-wrap; word-break: break-word; }
      .row { display: flex; gap: .5rem; justify-content: center; margin-top: 1rem; }
      button, input {
        font: inherit; padding: .45rem .8rem; border-radius: .45rem;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: Canvas; color: CanvasText;
      }
      input { min-width: 15rem; text-align: center; }
      #err { color: #c92a2a; min-height: 1.4em; }
      .spin { opacity: .6 }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">nooklet</h1>
      <p id="status" class="spin">Connecting…</p>
      <div id="problem" hidden>
        <p id="message"></p>
        <pre id="detail" hidden></pre>
      </div>
      <div id="help" hidden>
        <p id="help-message"></p>
        <pre>pnpm nooklet serve</pre>
        <div class="row">
          <input id="url" aria-label="Server address" />
          <button id="retry" type="button">Retry</button>
        </div>
        <p id="err"></p>
      </div>
    </main>
    <script type="module">
      // The desktop shell is deliberately a thin window onto the local server (ADR 016): loading
      // the server's own origin is what keeps the token handshake, OPFS storage and the sync
      // WebSocket working exactly as they do in a browser, with no CORS and no second copy of the
      // client that could drift from what the server serves.
      import { APP_PORT, describeStatus } from "./status.js";

      const KEY = "nooklet.desktop.serverUrl";
      const DEFAULT_URL = `http://127.0.0.1:${APP_PORT}`;
      const serverUrl = () => localStorage.getItem(KEY) || DEFAULT_URL;

      const $ = (id) => document.getElementById(id);
      const urlInput = $("url");
      urlInput.value = serverUrl();

      /** `no-cors` because /healthz sends no CORS headers: an opaque response still proves the
       * server answered, and a network failure still throws. That is all we need to know. */
      async function reachable(base) {
        try {
          await fetch(new URL("/healthz", base), { mode: "no-cors", cache: "no-store" });
          return true;
        } catch {
          return false;
        }
      }

      /** What the app knows about the server it started (B-430), or null with nobody to ask.
       * `__TAURI_INTERNALS__` is what Tauri 2 injects into its own pages; `@tauri-apps/api`'s
       * `invoke` is a wrapper over the same call, and this page has no bundler to import it. */
      async function serverStatus() {
        const invoke = window.__TAURI_INTERNALS__?.invoke;
        if (typeof invoke !== "function") return null;
        try {
          return await invoke("server_status");
        } catch {
          return null;
        }
      }

      let shown = "";
      function render(view) {
        // Re-rendered on every poll; only touch the DOM when the words change, so text being
        // selected in the output box is not wiped every few seconds.
        const key = JSON.stringify(view);
        if (key === shown) return;
        shown = key;
        $("title").textContent = view.kind === "starting" ? "nooklet" : view.title;
        $("status").hidden = view.kind !== "starting";
        $("status").textContent = view.title;
        $("problem").hidden = view.kind !== "problem";
        $("message").textContent = view.message;
        $("detail").hidden = !view.detail;
        $("detail").textContent = view.detail ?? "";
        $("help").hidden = !view.suggestServe;
        $("help-message").textContent = view.message;
      }

      let base = serverUrl();

      async function attempt() {
        if (await reachable(base)) {
          localStorage.setItem(KEY, base);
          location.replace(base);
          return true;
        }
        const status = await serverStatus();
        // The app's own server is up but the page is pointed elsewhere (a server address typed in
        // here once, remembered): open the one that answers rather than wait on "Starting" forever.
        if (status?.state === "ready" && base !== DEFAULT_URL) {
          base = DEFAULT_URL;
          return attempt();
        }
        render(describeStatus(status));
        return false;
      }

      $("retry").addEventListener("click", async () => {
        $("err").textContent = "";
        try {
          base = new URL(urlInput.value.trim()).origin;
        } catch {
          $("err").textContent = "That doesn't look like a URL.";
          return;
        }
        if (!(await attempt())) $("err").textContent = "Still no answer.";
      });

      // Keep checking while the window is open: a server that finishes starting, or one started
      // elsewhere, opens nooklet with no click. Quick while the app's server is starting (a normal
      // launch takes a second or two), slower once there is a problem on screen.
      async function loop() {
        if (await attempt()) return;
        const starting = JSON.parse(shown).kind === "starting";
        setTimeout(loop, starting ? 300 : 3000);
      }
      void loop();
    </script>
  </body>
</html>
