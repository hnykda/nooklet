[package]
name = "nooklet-desktop"
version = "0.1.0"
description = "nooklet desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR 032: "Connect to a server" is checked from Rust (no CORS), tokens live in the keychain, and
# each window gets a random request key.
ureq = "3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
getrandom = "0.3"
# B-786: a deleted This-Mac graph goes to the Trash (NSFileManager on macOS), not `rm -rf`.
trash = { version = "5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
