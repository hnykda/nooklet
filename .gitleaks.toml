# gitleaks config for the leak guard (.woodpecker/leak-guard.yaml; run locally with
#   docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 dir /repo --config /repo/.gitleaks.toml --redact
# ). gitleaks' default rules plus nooklet's own token formats.

title = "nooklet"

[extend]
useDefault = true

# packages/server/src/auth/tokens.ts (`nk_` + 24 random bytes as hex) and auth/root-token.ts
# (`nkroot_` + the same). Any real one in the repo is a live credential for somebody's server.
[[rules]]
id = "nooklet-token"
description = "nooklet API token or root token"
regex = '''\bnk(?:root)?_[0-9a-f]{48}\b'''
keywords = ["nk_", "nkroot_"]

# Known false positives of the default generic-api-key rule. Keep this list narrow: each entry is
# a shape that can never be a credential.
[[allowlists]]
description = "keymap entries ({ key: \"Mod+Shift+Enter\" }) and RFC 6455's sample Sec-WebSocket-Key nonce"
regexTarget = "line"
regexes = [
  '''(?i)["']?key["']?\s*:\s*["'](?:Mod|Shift|Alt|Ctrl|Meta|Cmd)\+''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
