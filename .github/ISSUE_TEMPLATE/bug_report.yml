name: Bug report
description: Something is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Click the sync indicator in the top bar and paste what the panel shows. It reports whether
        the client reached the API, whether search and embeddings are working, and what sync is
        doing — usually the fastest route to an answer.
      render: text
  - type: input
    id: version
    attributes:
      label: nooklet version
      placeholder: "0.1.0, or a commit hash if you built it yourself"
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Desktop app (Windows)
        - iOS app (built from source)
        - Android app (experimental APK)
        - Browser against my own server
        - Docker image
        - From source
    validations:
      required: true
