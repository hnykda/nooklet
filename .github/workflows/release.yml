# Release: builds every downloadable artifact and assembles the GitHub Release.
#
#   push of a tag v*        build everything, push the GHCR image, create the release as a draft,
#                           attach the files + SHA256SUMS, then publish it (only if every job
#                           succeeded; set repo variable RELEASE_KEEP_DRAFT=true to stop at draft)
#   workflow_dispatch       DRY RUN on any branch: builds every artifact and the image for both
#                           architectures, uploads them as workflow artifacts, pushes and releases
#                           nothing. Test this before the first tag (RELEASING.md).
#
# The tag is made by `pnpm release <version>` (tools/release.mjs), which also writes the
# CHANGELOG.md section used as the notes. The owner's own registry images are built by Woodpecker
# (.woodpecker/images.yaml), not here.
#
# Signing switches on by itself when secrets exist (names in RELEASING.md, "Secrets"):
#   macOS     APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#             + APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID for notarization
#   Android   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them: an unsigned macOS app and a debug-signed APK.
#
# Safety: no pull_request trigger, so no fork ever runs this or sees a secret; tags and manual runs
# need write access. Permissions default to none and each job asks for what it needs. Every
# action is pinned to a commit SHA (tag in the comment). Untrusted values (ref names) reach shell
# only through env, never through ${{ }} inside a script.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release per tag at a time; never cancel a half-finished release, queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"

jobs:
  meta:
    name: Version and notes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p 'require("./apps/web/package.json").version')
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            # tools/release.mjs bumps every file and tags in one commit; a hand-made tag that
            # disagrees with the files would ship binaries that report the wrong version.
            if [ "v$version" != "$REF_NAME" ]; then
              echo "::error::tag $REF_NAME does not match apps/web/package.json version $version"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "label=$version" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "label=$version-dryrun.${SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            node tools/ci/release-notes.mjs "$VERSION" > release-notes.md
          else
            node tools/ci/release-notes.mjs "$VERSION" --allow-missing > release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: the sidecar ships the BUILDING machine's Node, esbuild and
          # sqlite-vec binaries (apps/desktop/build-sidecar.mjs), so cross-compiling the Rust shell
          # alone would bundle the wrong architecture's server. Hence two macOS .dmg files rather
          # than one universal app (RELEASING.md, "Why not a universal macOS app").
          - os: macos-15
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: app,dmg
          # ubuntu-22.04 for an older glibc, so the AppImage runs on more distributions.
          - os: ubuntu-22.04
            label: linux-x64
            bundles: appimage,deb
          - os: windows-2025
            label: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The sidecar ships THIS Node version's official binary (build-sidecar.mjs), and
          # deploy/docker/Dockerfile builds on the same major.
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.label }}
          # A release build must not be seeded from a cache another branch could have written.
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential file libssl-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and bundle
        shell: bash
        env:
          LABEL_VERSION: ${{ needs.meta.outputs.label }}
          LABEL: ${{ matrix.label }}
          BUNDLES: ${{ matrix.bundles }}
          # Empty when the secrets are absent; desktop-bundle.sh then builds unsigned.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: bash tools/ci/desktop-bundle.sh "$LABEL_VERSION" "$LABEL" "$BUNDLES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK (experimental)
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Capacitor 8's generated project compiles with Java 21 (android/app/capacitor.build.gradle).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: pnpm install --frozen-lockfile
      - name: Build the APK
        env:
          LABEL_VERSION: ${{ needs.meta.outputs.label }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tools/ci/android-apk.sh "$LABEL_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  image:
    name: Server image (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64 runners (free for public repositories) instead of QEMU: the image's
          # build stage runs pnpm install and the Vite build, which take many times longer emulated.
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          # Pushed by digest only; the merge job below gives the multi-arch index its tags.
          outputs: ${{ needs.meta.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=cacheonly' }}
          provenance: false
      - if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.name.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Server image (multi-arch tags)
    needs: [meta, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          SHA: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${REPO,,}"
          # Same scheme as the Woodpecker images (tools/ci/image-tags.sh): vX.Y.Z + sha-<8>, and
          # latest only for a final release. X.Y.Z too, the form most docker users type.
          tags=(-t "$image:v$VERSION" -t "$image:$VERSION" -t "$image:sha-${SHA:0:8}")
          if [ "$PRERELEASE" = false ]; then tags+=(-t "$image:latest"); fi
          refs=()
          for digest in *; do refs+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$image:v$VERSION"

  release:
    name: GitHub Release
    needs: [meta, desktop, android, image-manifest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft, attach, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          KEEP_DRAFT: ${{ vars.RELEASE_KEEP_DRAFT }}
        run: |
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          # Draft first: if an upload fails, nothing half-finished is ever public.
          gh release create "$TAG" --draft --verify-tag "${pre[@]}" \
            --title "nooklet $TAG" --notes-file release-notes.md dist/*
          if [ "$KEEP_DRAFT" = true ]; then
            echo "RELEASE_KEEP_DRAFT=true: left as a draft; publish it on the Releases page."
          else
            gh release edit "$TAG" --draft=false
          fi
