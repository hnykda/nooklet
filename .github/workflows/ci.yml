name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      # The suite that actually catches integration bugs: a real Chromium against a real server
      # serving a real production build. See docs/BUGS.md for why this is not optional.
      # Both browsers: e2e/playwright.config.ts runs a WebKit project too (B-686). It is the
      # engine the iOS app and Safari run, so it stays in CI rather than being scoped out.
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # Playwright writes traces, videos and screenshots to e2e/test-results/<port>/
          # (outputDir in e2e/playwright.config.ts), not the repo root (B-687). CI uses the list
          # reporter only, so there is no HTML report to upload.
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 7
