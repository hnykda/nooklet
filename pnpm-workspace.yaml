packages:
  - packages/*
  - apps/*
  # Built-in plugins are workspace members so each can declare its own dependencies (mermaid's
  # renderer library) and resolve `@nooklet/plugin-api` types, exactly like a plugin author's
  # `npm install` in their own plugin directory (ADR 007, ADR 023).
  - plugins/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.13'
  - '@biomejs/cli-darwin-arm64@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
  - '@biomejs/cli-linux-arm64-musl@2.5.13'
  - '@biomejs/cli-linux-arm64@2.5.13'
  - '@biomejs/cli-linux-x64-musl@2.5.13'
  - '@biomejs/cli-linux-x64@2.5.13'
  - '@biomejs/cli-win32-arm64@2.5.13'
  - '@biomejs/cli-win32-x64@2.5.13'
  - '@types/node@22.20.2'
  - zod@4.6.1
  - vite@8.3.0
